services:
  arachne-datanode-postgres:
    image: postgres:15.5-alpine
    pull_policy: always
    container_name: arachne-datanode-postgres
    restart: always
    logging:
      options:
        max-size: 100m
    shm_size: "4g"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - arachne-pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ohdsi-user
      POSTGRES_PASSWORD: ohdsi-password
      POSTGRES_DB: arachne_datanode

  arachne-cdm-postgres:
    image: arachne-cdm-postgres:local
    pull_policy: never
    container_name: arachne-cdm-postgres
    restart: always
    logging:
      options:
        max-size: 100m
    shm_size: "4g"
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ${CDM_POSTGRES_DATA:-arachne-cdm-pg-data}:/var/lib/postgresql/data
      - ./cdm-imports:/opt/arachne-cdm/imports
    environment:
      POSTGRES_USER: cdm-user
      POSTGRES_PASSWORD: cdm-password
      POSTGRES_DB: cdm54
      CDM_SCHEMA: omop
      CDM_VERSION: 5.4.2

  arachne-execution-engine:
    image: odysseusinc/execution_engine:2.7.1
    pull_policy: always
    platform: linux/amd64
    container_name: arachne-execution-engine
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/executions:/etc/executions
      - /tmp/arachne-empty-runtimes:/runtimes-empty
    environment:
      - applyRuntimeDependenciesComparisonLogic=true
      - libraries.location.strategus=strategus
      - DOCKER_IMAGE_DEFAULT=odysseusinc/r-hades:latest
      - DOCKER_IMAGE_FILTER=odysseusinc/r-hades(.+)
      - ANALYSIS_MOUNT=/tmp/executions
      - RUNTIMESERVICE_DIST_VERBOSE_LOG=true
      - RUNTIMESERVICE_DIST_ARCHIVEFOLDER=/runtimes-empty/

  arachne-datanode:
    image: arachne-datanode-local
    pull_policy: never
    container_name: arachne-datanode
    platform: linux/amd64
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - arachne-datanode-files:/var/arachne/files
    env_file:
      - datanode.env
    depends_on:
      - arachne-datanode-postgres
      - arachne-execution-engine

volumes:
  arachne-pg-data:
  arachne-cdm-pg-data:
  arachne-datanode-files:
