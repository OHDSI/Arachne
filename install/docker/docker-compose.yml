version: '3'
services:

  # External PostgreSQL database for Arachne Datanode (auth, analyses, study repository, etc.).
  # Flyway runs on app startup and applies migrations from db/migration.
  arachne-datanode-postgres:
    image: postgres:15.5-alpine
    pull_policy: always
    container_name: arachne-datanode-postgres
    restart: always
    logging:
      options:
        max-size: 100m
    shm_size: "4g"
    networks:
      - arachne-network
    ports:
      - "127.0.0.1:5434:5432" # host:container (connect from host: localhost:5434)
    volumes:
      - arachne-pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ohdsi-user
      POSTGRES_PASSWORD: ohdsi-password
      POSTGRES_DB: arachne_datanode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohdsi-user -d arachne_datanode"]
      interval: 5s
      timeout: 5s
      retries: 5

  # For analysis execution, run the in-repo docker-runner (see docker-runner/README.md)
  # and point the datanode execution engine URL at it (e.g. http://host:8888).

  # Arachne Datanode Service
  arachne-datanode:
    image: odysseusinc/arachne-datanode-ce:latest
    pull_policy: always
    container_name: arachne-datanode
    platform: linux/amd64
    restart: always
    networks:
      - arachne-network
    ports:
      - "8080:8080" # Port mapping (host:container)
    volumes:
      - arachne-datanode-files:/var/arachne/files  # Volume mount for Arachne data
    env_file:
      - datanode.env  # Environment variables file
    depends_on:
      arachne-datanode-postgres:
        condition: service_healthy

# Volumes for the services
volumes:
  arachne-pg-data:
  arachne-datanode-files:

# Network definition
networks:
  arachne-network:
