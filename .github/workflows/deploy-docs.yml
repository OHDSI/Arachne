# Build the docs/website with MkDocs and deploy to GitHub Pages.
#
# Setup:
# 1. Settings → Pages → Build and deployment → Source = "GitHub Actions".
# 2. If you see "Branch main is not allowed to deploy": go to Settings →
#    Environments → github-pages → Deployment protection rules, and either
#    allow the "main" branch for deployment or add it to the allowed list.
# 3. Push to the branch that triggers this workflow (see on.push.branches below).
#
# The site will be at: https://<owner>.github.io/<repo>/

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and Material theme
        run: pip install mkdocs-material

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
